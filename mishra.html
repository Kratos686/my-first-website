<!DOCTYPE html>
<html>
    <head>
      <meta name="viewport" content="width=device=width", initial-scale="1.0">
        <title>Second page built by me</title>
        <style>
          h1{
            font-size:clamp(28px, 6vw, 40px);
            color: rgb(255, 255, 255);
            text-align: center;
          }
          body{
            text-align: center;
            background-color: black;
          }
          button{
            width: 80%;
            max-width:250px;
            color: rgb(255, 0, 0);
            background-color: rgb(17, 0, 254);
            padding: 10px 20px;
            border: none;
            border-radius: 200px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
          }
          button:hover{
            transform: scale(1.2);
          }
          img{
            width:50%;
            max-width:200px;
            height:auto;
            aspect-ratio: 1/1;
            border-radius:50%;
          }
          p{
            background-color: rgb(214, 230, 0);
            font-size:clamp(16px, 4vw, 20px);
            font-size: 20px;
          
        }@media (max-width:600px){
          h1{
            font-size:28px;
          }
          img{
            width:150px;
          }
          button{
            width:90%
          }
          p{
            font-size:16px;
          }
        }
        </style>
    </head>
<body>
    <hr>
    <h1>KRATOS HOLIC</h1>
    <img src="Kratos.jfif" height="200" width="300">
    <p id="Kratos">CONQUERING EVERY FEATS OF BIENG A TEENAGER</p>
    <button onclick="goBack()">
      BACK
    </button>
    <button onclick="goNext()">
      ZEUS
    </button>
    <hr>
    <audio id="clickSound">
    <source src="click.wav.wav" type="audio/wav">
</audio>
<audio id="bgMusic" loop>
    <source src="ummm.mp3" type="audio/mp3">
</audio>
    <script>
      function goBack(){
        window.location.href = "index.html";
      }
      function goNext(){
        window.location.href = "ZEUS.html"
      }
      window.onload = function () {
    let music = document.getElementById("bgMusic");
    music.play().catch(function(error) {
        console.log(error);
    });
}
document.addEventListener("click",function(){
  document.getElementById("bgMusic").play();
},{ once: true});

    </script>
</body>
</html>
